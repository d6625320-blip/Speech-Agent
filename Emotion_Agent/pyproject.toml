[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-agent"
version = "0.1.0"
description = "Self-hosted Chinese voice dialogue with a trained speech emotion expert"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2", "scipy>=1.11,<2", "soundfile>=0.12,<1",
  "PyYAML>=6,<7", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
speech = ["torch>=2.3,<3", "torchaudio>=2.3,<3", "funasr>=1.4,<2"]
download = ["modelscope>=1.20,<2"]

[project.scripts]
emotion-agent = "emotion_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emotion_agent = ["web/*"]
